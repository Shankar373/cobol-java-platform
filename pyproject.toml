[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "cobol-java-platform"
version = "0.1.0"
description = "Clean Mainframe COBOL to Native Java modernization platform"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "Apache-2.0"}

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "transformation*", "generators*", "verification*", "platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "docker: requires Docker daemon",
    "postgresql: requires PostgreSQL container",
    "differential: COBOL vs Java differential test",
    "slow: long-running test",
]
